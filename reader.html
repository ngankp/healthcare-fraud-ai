<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAD — PM Artifact</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:    #0d1b2e;
      --navy-2:  #112240;
      --navy-3:  #1a3556;
      --blue:    #1565c0;
      --blue-lt: #1976d2;
      --text:    #cdd8e8;
      --muted:   #8fa3be;
      --border:  #1f3a5f;
      --code-bg: #0a1628;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--navy);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.7;
    }

    /* ── Nav ── */
    nav {
      background: var(--navy-2);
      border-bottom: 1px solid var(--border);
      padding: 0 40px;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .nav-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue-lt); flex-shrink: 0; }
    .nav-brand { font-size: 14px; font-weight: 600; color: var(--text); }
    .nav-sep { color: var(--border); font-size: 18px; }
    .nav-title { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .nav-back {
      margin-left: auto;
      font-size: 12px;
      font-weight: 600;
      color: var(--blue-lt);
      text-decoration: none;
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 5px;
      flex-shrink: 0;
      transition: border-color 0.12s;
    }
    .nav-back:hover { border-color: var(--blue-lt); }

    /* ── Loading / Error ── */
    #loading, #error {
      max-width: 680px;
      margin: 80px auto;
      padding: 0 40px;
      text-align: center;
      color: var(--muted);
    }
    #error { color: #ef9a9a; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--blue-lt);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Content ── */
    #content {
      max-width: 740px;
      margin: 0 auto;
      padding: 56px 40px 80px;
    }

    /* ── Markdown styles ── */
    #content h1 {
      font-size: 32px;
      font-weight: 800;
      color: #e8f0fb;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    #content h2 {
      font-size: 20px;
      font-weight: 700;
      color: #e8f0fb;
      margin-top: 48px;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    #content h3 {
      font-size: 16px;
      font-weight: 700;
      color: #cdd8e8;
      margin-top: 32px;
      margin-bottom: 10px;
    }
    #content h4 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--blue-lt);
      margin-top: 24px;
      margin-bottom: 8px;
    }
    #content p {
      color: var(--text);
      margin-bottom: 16px;
      font-size: 15px;
    }
    #content a {
      color: var(--blue-lt);
      text-decoration: underline;
    }
    #content strong { color: #e8f0fb; font-weight: 700; }
    #content em { color: #b0c4de; font-style: italic; }

    /* Blockquote — used for callouts and investigator quotes */
    #content blockquote {
      border-left: 3px solid var(--blue-lt);
      background: var(--navy-2);
      padding: 14px 20px;
      margin: 20px 0;
      border-radius: 0 6px 6px 0;
    }
    #content blockquote p {
      color: #b0c4de;
      font-style: italic;
      margin: 0;
      font-size: 14px;
    }

    /* Tables */
    #content table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      font-size: 13px;
    }
    #content thead tr {
      background: var(--navy-3);
    }
    #content th {
      padding: 10px 14px;
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--blue-lt);
      border-bottom: 1px solid var(--border);
    }
    #content td {
      padding: 9px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      vertical-align: top;
    }
    #content tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
    #content tr:last-child td { border-bottom: none; }

    /* Code blocks */
    #content pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px 20px;
      overflow-x: auto;
      margin: 20px 0;
    }
    #content pre code {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 12.5px;
      color: #a8c7fa;
      background: none;
      padding: 0;
      border-radius: 0;
      line-height: 1.6;
    }
    #content code {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 12px;
      background: var(--navy-3);
      color: #a8c7fa;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Lists */
    #content ul, #content ol {
      padding-left: 24px;
      margin-bottom: 16px;
    }
    #content li {
      color: var(--text);
      margin-bottom: 6px;
      font-size: 15px;
      line-height: 1.6;
    }
    #content li > ul, #content li > ol { margin-top: 6px; margin-bottom: 4px; }

    /* HR */
    #content hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 40px 0;
    }

    /* Images (if any) */
    #content img { max-width: 100%; border-radius: 6px; }

    /* Mermaid diagram placeholder */
    .mermaid-note {
      background: var(--navy-2);
      border: 1px dashed var(--border);
      border-radius: 6px;
      padding: 16px 20px;
      font-size: 12px;
      color: var(--muted);
      margin: 16px 0;
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-dot"></div>
    <span class="nav-brand">PAD</span>
    <span class="nav-sep">/</span>
    <span class="nav-title" id="nav-title">Loading…</span>
    <a class="nav-back" href="index.html">← Back</a>
  </nav>

  <div id="loading">
    <div class="spinner"></div>
    <p>Loading document…</p>
  </div>

  <div id="error" style="display:none">
    <p id="error-msg">Could not load document.</p>
    <p style="margin-top:12px; font-size:13px"><a href="index.html" style="color:var(--blue-lt)">← Back to case study</a></p>
  </div>

  <div id="content" style="display:none"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const file   = params.get('file');

    // Derive a readable title from the filename
    function titleFromFile(f) {
      if (!f) return 'Document';
      const base = f.split('/').pop().replace(/\.md$/, '');
      return base.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    }

    if (!file) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display   = 'block';
      document.getElementById('error-msg').textContent = 'No file specified.';
    } else {
      document.getElementById('nav-title').textContent = titleFromFile(file);
      document.title = titleFromFile(file) + ' — PAD Case Study';

      fetch(file)
        .then(r => {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.text();
        })
        .then(md => {
          // Configure marked
          marked.setOptions({ gfm: true, breaks: false });

          // Strip Mermaid code blocks — replace with a readable note
          const cleaned = md.replace(/```mermaid[\s\S]*?```/g,
            '<div class="mermaid-note">📊 Architecture diagram — view in the <a href="https://github.com/ngankp/healthcare-fraud-ai/blob/main/' + file + '" target="_blank">GitHub source</a> for the interactive Mermaid render.</div>');

          document.getElementById('content').innerHTML = marked.parse(cleaned);
          document.getElementById('loading').style.display  = 'none';
          document.getElementById('content').style.display  = 'block';

          // Set page title from first H1 if present
          const h1 = document.querySelector('#content h1');
          if (h1) {
            document.title = h1.textContent + ' — PAD Case Study';
            document.getElementById('nav-title').textContent = h1.textContent;
          }
        })
        .catch(err => {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('error').style.display   = 'block';
          document.getElementById('error-msg').textContent = 'Could not load document: ' + err.message;
        });
    }
  </script>

</body>
</html>
